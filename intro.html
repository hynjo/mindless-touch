<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#111111" />
    <title>Where is meow</title>
    <style>
      html,
      body {
        background: #000000;
      }
    </style>
    <script>
      try {
        if (sessionStorage.getItem("village-paw-transition") === "pending") {
          sessionStorage.removeItem("village-paw-transition");
          document.documentElement.classList.add("is-entering-from-map");
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="app" aria-label="Tap the screen to start">
      <canvas id="playfield"></canvas>
      <p id="status" class="visually-hidden" aria-live="polite">
        Tap the screen to start.
      </p>
      <div class="intro" aria-hidden="true">
        <svg class="intro-speaker" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M10 25h11l14-11v36L21 39H10z"></path>
          <path class="intro-sound-wave" d="M43 23c5 5 5 13 0 18"></path>
          <path class="intro-sound-wave intro-sound-wave-outer" d="M50 16c9 9 9 23 0 32"></path>
        </svg>
        <span class="paw-touch intro-touch is-success">
          <span class="paw-glyph">
            <span class="intro-paw-pad"></span>
            <span class="intro-paw-toe intro-paw-toe-1"></span>
            <span class="intro-paw-toe intro-paw-toe-2"></span>
            <span class="intro-paw-toe intro-paw-toe-3"></span>
            <span class="intro-paw-toe intro-paw-toe-4"></span>
          </span>
        </span>
        <span class="intro-cat-position">
          <span class="cat-eyes intro-demo-eyes">
            <span class="cat-eye"></span>
            <span class="cat-eye"></span>
          </span>
        </span>
      </div>
      <a class="village-return" href="/" aria-label="Return to the cat village" hidden>
        <svg viewBox="0 0 56 52" aria-hidden="true">
          <path d="M28.5 24C36.4 24 42 29.1 42 36.6S36.5 47 28.5 47 15 44.1 15 36.6 20.6 24 28.5 24Z" />
          <ellipse cx="8.5" cy="22.5" rx="5.5" ry="7.5" transform="rotate(-28 8.5 22.5)" />
          <ellipse cx="20.5" cy="10.5" rx="5.5" ry="7.5" transform="rotate(-10 20.5 10.5)" />
          <ellipse cx="35.5" cy="10.5" rx="5.5" ry="7.5" transform="rotate(10 35.5 10.5)" />
          <ellipse cx="47.5" cy="22.5" rx="5.5" ry="7.5" transform="rotate(28 47.5 22.5)" />
        </svg>
      </a>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
